name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build TripBirr Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'react-native/package-lock.json'

      - name: Install React Native Dependencies
        working-directory: ./react-native
        run: npm install --legacy-peer-deps

      - name: Link node_modules across build paths
        run: |
          ln -s react-native/node_modules node_modules || true
          mkdir -p react-native/android
          ln -s ../node_modules react-native/android/node_modules || true

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Generate Debug Keystore
        working-directory: ./react-native/android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        working-directory: ./react-native/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload TripBirr APK
        uses: actions/upload-artifact@v4
        with:
          name: TripBirr-Debug-APK
          path: react-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

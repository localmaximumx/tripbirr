name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build TripBirr Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build Web Application Bundle
        run: |
          npm install --legacy-peer-deps
          npm run build
          mkdir -p react-native/android/app/src/main/assets/web
          cp -r dist/* react-native/android/app/src/main/assets/web/

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Generate Debug Keystore
        working-directory: ./react-native/android/app
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android APK
        working-directory: ./react-native/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload TripBirr APK
        uses: actions/upload-artifact@v4
        with:
          name: TripBirr-APK
          path: react-native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-latest
          name: "TripBirr v1.0.0 (Latest Cloud & Offline APK)"
          body: |
            ### TripBirr Android APK Release
            - Telebirr SMS 127 automatic detection & extraction.
            - 100% offline-first local SQLite operation.
            - Supabase cloud database & user account synchronization.
            - Multi-device login and automatic data restoration.
            - Driver earnings, trip tracking, and financial ledgers.
          files: react-native/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

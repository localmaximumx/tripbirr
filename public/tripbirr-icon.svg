<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background dark obsidian navy gradient -->
    <linearGradient id="tbBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#141B2D" />
      <stop offset="60%" stopColor="#0B0F1A" />
      <stop offset="100%" stopColor="#060911" />
    </linearGradient>

    <!-- Pin emerald gradient matching app interface -->
    <linearGradient id="tbPin" x1="160" y1="80" x2="352" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#2CD48D" />
      <stop offset="100%" stopColor="#10B981" />
    </linearGradient>

    <!-- Gold inner emblem matching app cash gold -->
    <linearGradient id="tbGold" x1="200" y1="140" x2="312" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FBBF24" />
      <stop offset="100%" stopColor="#F5BA36" />
    </linearGradient>

    <filter id="tbShadow" x="100" y="80" width="312" height="340" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" floodColor="#10B981" floodOpacity="0.32" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#tbBg)" />
  <rect x="20" y="20" width="472" height="472" rx="114" stroke="#1E293B" stroke-width="4" />

  <!-- 4 Waypoint Trail Dots in Telebirr Sky Blue -->
  <circle cx="170" cy="426" r="16" fill="#5CA4F8" />
  <circle cx="218" cy="410" r="16" fill="#5CA4F8" />
  <circle cx="294" cy="410" r="16" fill="#5CA4F8" />
  <circle cx="342" cy="426" r="16" fill="#5CA4F8" />

  <!-- Emerald Location Pin -->
  <g filter="url(#tbShadow)">
    <path
      d="M256 100 C188 100, 134 154, 134 222 C134 300, 256 414, 256 414 C256 414, 378 300, 378 222 C378 154, 324 100, 256 100 Z"
      fill="url(#tbPin)"
    />
  </g>

  <!-- Golden Sun Circle -->
  <circle cx="256" cy="216" r="62" fill="url(#tbGold)" />

  <!-- Bold Dark 'B' Character -->
  <text
    x="256"
    y="241"
    text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="76"
    fill="#052115"
  >
    B
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="tbBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#151D2F" />
      <stop offset="60%" stopColor="#0D1322" />
      <stop offset="100%" stopColor="#080C16" />
    </linearGradient>
    <linearGradient id="tbPin" x1="160" y1="80" x2="352" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3EE8A2" />
      <stop offset="100%" stopColor="#18BE7E" />
    </linearGradient>
    <linearGradient id="tbGold" x1="200" y1="140" x2="312" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#FFE082" />
      <stop offset="100%" stopColor="#FFC132" />
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#tbBg)" />
  <rect x="20" y="20" width="472" height="472" rx="114" stroke="#1E293B" stroke-width="4" />

  <!-- 4 Waypoint Trail Dots Under Pin Tip -->
  <circle cx="170" cy="426" r="16" fill="#60A5FA" />
  <circle cx="218" cy="410" r="16" fill="#60A5FA" />
  <circle cx="294" cy="410" r="16" fill="#60A5FA" />
  <circle cx="342" cy="426" r="16" fill="#60A5FA" />

  <!-- Green Location Pin -->
  <path
    d="M256 100 C188 100, 134 154, 134 222 C134 300, 256 414, 256 414 C256 414, 378 300, 378 222 C378 154, 324 100, 256 100 Z"
    fill="url(#tbPin)"
  />

  <!-- Golden Sun Circle -->
  <circle cx="256" cy="216" r="62" fill="url(#tbGold)" />

  <!-- Bold Black 'B' Character -->
  <text
    x="256"
    y="241"
    text-anchor="middle"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="76"
    fill="#0D1322"
  >
    B
  </text>
</svg>

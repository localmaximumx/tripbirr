<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TripBirr — Telebirr Driver Companion</title>
    <meta name="description" content="Offline-first Android companion for Ethiopian drivers to automatically detect Telebirr 127 SMS payments, associate payments with trips, and track per-trip earnings." />
    <meta property="og:title" content="TripBirr — Telebirr Driver Companion" />
    <meta property="og:description" content="Offline-first Android companion for Ethiopian drivers to automatically detect Telebirr 127 SMS payments, associate payments with trips, and track per-trip earnings." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0B0F1A" />
    <link rel="icon" type="image/svg+xml" href="/tripbirr-icon.svg" />
    <link rel="apple-touch-icon" href="/tripbirr-icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        background-color: #0B0F1A !important;
        margin: 0;
        padding: 0;
        color: #EDF6F0;
        min-height: 100vh;
        -webkit-tap-highlight-color: transparent;
      }
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #0B0F1A;
      }
      #root:empty::after {
        content: "";
        width: 44px;
        height: 44px;
        border: 3.5px solid rgba(44, 212, 141, 0.15);
        border-top-color: #2CD48D;
        border-radius: 50%;
        animation: tb-spin 0.75s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes tb-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#0B0F1A] text-[#EDF6F0] antialiased selection:bg-[#2CD48D]/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
